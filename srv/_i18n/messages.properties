# =============================================================================
# srv/_i18n/messages.properties
# All user-facing message keys. Error codes must reference these keys.
# Raw string literals in req.error() are prohibited per BLKM standards.
# =============================================================================

# ---------------------------------------------------------------------------
# Validation Errors
# ---------------------------------------------------------------------------
MISSING_MANDATORY_FIELDS=One or more mandatory fields are missing. Please complete all required fields and try again.
ORDER_NOT_MODIFIABLE=This order cannot be modified because it has already been completed or cancelled.
ORDER_BLOCKED=This order is currently blocked and cannot be processed. Please contact your sales administrator.
ORDER_CREDIT_HOLD=This order is on credit hold. Please contact the finance team to release the hold before submitting.
INVALID_STATUS_TRANSITION=The requested status change is not permitted from the current order status.
ORDER_NOT_FOUND=The requested sales order could not be found.
ORDER_NOT_ON_CREDIT_HOLD=This order is not currently on credit hold.

# ---------------------------------------------------------------------------
# Action Confirmations
# ---------------------------------------------------------------------------
ORDER_SUBMITTED=Sales order {0} has been successfully submitted for processing.
ORDER_CANCELLED=Sales order {0} has been cancelled.
CREDIT_HOLD_RELEASED=Credit hold on order {0} has been successfully released.

