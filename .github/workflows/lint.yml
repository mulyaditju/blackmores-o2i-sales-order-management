name: Full-Stack CAP CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for GitHub Releases

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install SAP Tooling & MBT
        run: |
          npm install -g @sap/cds-dk
          npm install -g mbt

      - name: Run Quality Checks & Linting
        run: npm run lint

      - name: Get Project Version
        id: get_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Build MTA Archive
        run: mbt build -t gen/mta_archives/

      - name: Install Cloud Foundry CLI & MTA Plugin
        if: github.event_name == 'push'
        run: |
          wget -q -O - https://cloudfoundry.org | sudo apt-key add -
          echo "deb https://cloudfoundry.org stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update
          sudo apt-get install cf8-cli
          cf add-plugin-repo CF-Community https://cloudfoundry.org
          cf install-plugin multiapps -f

      - name: Deploy to Cloud Foundry (dev space)
        if: github.event_name == 'push'
        run: |
          cf login -a "${{ secrets.BTP_CENTER_URL }}" \
                   -u "${{ secrets.BTP_USER }}" \
                   -p "${{ secrets.BTP_PASSWORD }}" \
                   -o "${{ secrets.BTP_ORG }}" \
                   -s dev
          cf deploy gen/mta_archives/*.mtar -f

      - name: Create Production Release & Upload MTAR
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: gen/mta_archives/*.mtar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
